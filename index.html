<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LaundryKu - Kelola laundry, catat kas, tanpa ribet"
    />
    <title>LaundryKu</title>
    <script>
      // Terapkan tema sebelum render pertama agar tidak berkedip.
      (function () {
        try {
          var saved = localStorage.getItem("laundryku-theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var dark =
            saved === "dark" || ((saved === "system" || !saved) && prefersDark);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* abaikan */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
